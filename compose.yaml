services:
  api:
    build:
      context: .
      args: { APP_VERSION: local }
    environment: { ENVIRONMENT: compose }
    ports: ["8080:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
  prometheus:
    image: prom/prometheus:v3.4.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: radar
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/release-radar.json
    volumes:
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./observability/grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./observability/dashboard.json:/var/lib/grafana/dashboards/release-radar.json:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
